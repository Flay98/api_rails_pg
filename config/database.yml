default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  host: <%= ENV.fetch("PGHOST", "127.0.0.1").to_json %>
  port: <%= ENV.fetch("PGPORT", 5433) %>
  username: <%= ENV.fetch("PGUSER", "yanik_pryanik").to_json %>
  password: <%= ENV.fetch("API_RAILS_PG_DATABASE_PASSWORD", ENV["PGPASSWORD"]).to_json %>

development:
  <<: *default
  database: api_rails_pg_development

test:
  <<: *default
  database: api_rails_pg_test

production:
  <<: *default
  database: api_rails_pg_production
